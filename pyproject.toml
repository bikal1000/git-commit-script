[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-lint"
version = "0.1.0"
description = "Interactive git commit message helper with staged-diff analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Bikal Shrestha" }
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
commit-lint = "commitlint.cli:app"

[project.urls]
Homepage = "https://github.com/bikal1000/git-commit-script"

[tool.hatch.build.targets.wheel]
packages = ["src/commitlint"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
